services:
  postgres:
    image: postgres:16-alpine
    container_name: branchwork-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: branchwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: branchwork-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/branchwork?schema=public"
      JWT_SECRET: "branchwork_super_secret_jwt_key_2026"
      JWT_EXPIRES_IN: "1d"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
